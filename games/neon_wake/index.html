<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b0617">
<!-- LORPcade: slug (save keys + cloud document name) and where QUIT goes. "../" from /neon_wake/ is https://lorpcade.github.io/ -->
<meta name="lorpcade-slug" content="neon_wake">
<meta name="lorpcade-home" content="../">
<title>NEON WAKE</title>
<style>
  :root { --ink:#0b0617; --pink:#ff2d95; --cyan:#00e5ff; --yellow:#ffe14d; }
  html, body { margin:0; height:100%; background:var(--ink); color:#fff; overflow:hidden; overscroll-behavior:none;
    font-family: "Courier New", ui-monospace, monospace; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
    -webkit-tap-highlight-color: transparent; touch-action:none; }
  /* the game area keeps clear of notches and the home bar on phones (all insets are 0 on desktop) */
  #stage { position:fixed; left:env(safe-area-inset-left,0px); top:env(safe-area-inset-top,0px);
    right:env(safe-area-inset-right,0px); bottom:env(safe-area-inset-bottom,0px); background:var(--ink); }
  #game { position:absolute; left:0; top:0; width:100%; height:100%; display:block; outline:none; touch-action:none; }
  .overlay { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center;
    background:var(--ink); z-index:10; letter-spacing:.12em; padding:24px; box-sizing:border-box; }
  .logo { font-size:clamp(28px,7vw,64px); font-weight:bold; color:var(--pink); text-shadow:0 0 18px var(--pink), 3px 3px 0 var(--cyan); }
  .sub { margin-top:14px; color:var(--cyan); font-size:clamp(12px,2.2vw,18px); }
  #bar { width:min(60vw,360px); height:8px; margin-top:22px; background:#241a3c; border:1px solid var(--cyan); }
  #fill { height:100%; width:0; background:var(--yellow); }
  #fatal { display:none; } #fatal pre { max-width:90vw; white-space:pre-wrap; color:#ff7070; font-size:12px; text-align:left; }
  #stale { position:fixed; left:0; right:0; top:0; z-index:30; padding:8px 12px; text-align:center; background:var(--yellow); color:var(--ink);
    font-size:13px; letter-spacing:.08em; }
  #stale[hidden] { display:none; } #stale button { font:inherit; margin-left:10px; padding:2px 10px; cursor:pointer; }
  #rotate { display:none; z-index:20; font-size:clamp(16px,4vw,26px); color:var(--yellow); }
  /* phones held upright: ask for landscape (the game is a wide-screen game) */
  @media (orientation:portrait) and (pointer:coarse) { #rotate.on { display:flex; } }
</style>
</head>
<body>
<div id="stage"><canvas id="game" tabindex="0"></canvas></div>

<div id="loading" class="overlay">
  <div class="logo">NEON WAKE</div>
  <div class="sub" id="status">LOADING</div>
  <div id="bar"><div id="fill"></div></div>
</div>
<div id="fatal" class="overlay">
  <div class="logo" style="font-size:32px">SOMETHING BROKE</div>
  <pre id="fatal-text"></pre>
  <div class="sub">RELOAD THE PAGE TO RESTART</div>
</div>
<div id="rotate" class="overlay">
  <div class="logo" style="font-size:clamp(22px,6vw,40px)">ROTATE YOUR DEVICE</div>
  <div class="sub">NEON WAKE PLAYS IN LANDSCAPE</div>
</div>

<div id="stale" hidden>SAVE CHANGED ON ANOTHER DEVICE <button id="stale-btn">RELOAD</button></div>

<script>
// ---- LORPcade page conventions (see "Building a game for LORPcade")
const folderName = (() => {
  const meta = document.querySelector('meta[name="lorpcade-slug"]');
  if (meta && meta.content) return meta.content;
  const parts = location.pathname.split("/").filter(Boolean);
  if (parts.length && /\.[a-z0-9]+$/i.test(parts[parts.length - 1])) parts.pop();
  return parts.length ? decodeURIComponent(parts[parts.length - 1]) : "neon_wake";
})();
window.NW_SLUG = folderName;
const homeMeta = document.querySelector('meta[name="lorpcade-home"]');
// QUIT on the title menu: leave fullscreen, then back to the LORPcade home page
window.esGoHome = () => {
  try { if (document.fullscreenElement) document.exitFullscreen(); } catch (_) {}
  try { if (screen.orientation && screen.orientation.unlock) screen.orientation.unlock(); } catch (_) {}
  location.assign(new URL((homeMeta && homeMeta.content) || "../", location.href).href);
};
// the number the home-screen cabinet shows as HI (a plain number under lorpcade:hiscore:<slug>); only written when it changed
window.esHiscore = (score) => {
  try {
    const key = "lorpcade:hiscore:" + folderName, v = String(Math.max(0, Math.floor(score)));
    if (localStorage.getItem(key) !== v) localStorage.setItem(key, v);
  } catch (_) {}
};
document.getElementById('stale-btn').onclick = () => location.reload();
</script>
<!-- cloud sync: 404 when served alone = no sync, no errors -->
<script src="../arcade-assets/lorpcade-sync.js"></script>
<script src="neonwake.js"></script>
</body>
</html>
